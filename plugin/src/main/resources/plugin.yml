name: ${plugin.pluginName}
version: ${plugin.version}
description: ${project.description}
author: Leialoha
website: https://leialoha.dev

main: dev.leialoha.bettergamerules.BetterGamerulesPlugin
prefix: ${project.name}
api-version: '1.20'
load: STARTUP

permissions:
  permission.${project.name}.admin:
    description: "Admin permissions for ${project.name}"
    default: op # this should be given to all ops
    children:
      permission.${project.name}.commands.*: true
  permission.${project.name}.commands.*:
    description: "Permissions for all the ${project.name} commands"
    default: false # this should be given from +.admin
    children:
      permission.${project.name}.commands.example: true
  permission.${project.name}.commands.example:
    description: "Permissions for manipulating ${project.name}"
    default: false # this should be given from +.commands.*

commands:
  example:
    description: "The base command for manipulating ${project.name}"
    usage: "/example <args>"
    aliases: [ex, sample]
    permission: permission.${project.name}.commands.example
    permission-message: "You do not have permission to use this command"
